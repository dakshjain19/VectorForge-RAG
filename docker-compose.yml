services:
  vectordb:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_HOST: 0.0.0.0
      OLLAMA_HOST: ollama
    volumes:
      - vector_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q nomic-embed-text && ollama list | grep -q llama3.2"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    restart: unless-stopped

volumes:
  ollama_data:
  vector_data:
